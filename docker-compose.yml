# ==============================================================================
# AfyaConnect Local Docker Compose Configuration
# Spins up FastAPI backend and Vite frontend with unified networking.
# ==============================================================================

version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: afyaconnect_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./afyaconnect.db
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CLAUDE_MODEL=claude-3-7-sonnet-20250219
      - SECRET_KEY=afyaconnect-secret-key-nairobi-2026
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
    volumes:
      - ./afyaconnect.db:/app/afyaconnect.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: afyaconnect_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
